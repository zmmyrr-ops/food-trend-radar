# Include inside the existing HTTPS server block only.
location = /food-trend-radar { return 301 /food-trend-radar/; }
location ^~ /food-trend-radar/ {
    auth_basic "Food Trend Radar";
    auth_basic_user_file /etc/nginx/food-trend-radar.htpasswd;
    add_header X-Robots-Tag "noindex, nofollow" always;
    proxy_pass http://127.0.0.1:3011/;
    # The backend deliberately accepts only loopback Host headers.
    proxy_set_header Host 127.0.0.1:3011;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 120s;
    client_max_body_size 2m;
}
