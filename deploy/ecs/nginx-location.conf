# Retire the former project path in the ruming.top HTTPS server.
# No redirect: keep the new site's authentication and traffic independent.
location = /food-trend-radar { return 410; }
location ^~ /food-trend-radar/ { return 410; }

# Dedicated mini-program gateway; website/admin routes remain on tanhaodian.cn.
location ^~ /api/mini/ {
    auth_basic off;
    proxy_pass http://127.0.0.1:3011;
    proxy_set_header Host 127.0.0.1:3011;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 30s;
    client_max_body_size 128k;
    add_header X-Robots-Tag "noindex, nofollow" always;
}
