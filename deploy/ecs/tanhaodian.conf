# Independent site; do not include inside the ruming.top server block.
server {
    listen 80;
    server_name tanhaodian.cn;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/tanhaodian-acme;
    }
    location / { return 301 https://tanhaodian.cn$request_uri; }
}
server {
    listen 443 ssl http2;
    server_name tanhaodian.cn;
    ssl_certificate /etc/letsencrypt/live/tanhaodian.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tanhaodian.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header X-Robots-Tag "noindex, nofollow" always;
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript text/javascript application/json;
    # Dedicated mini-program gateway; application requires a WeChat session.
    location ^~ /api/mini/ {
        auth_basic off;
        proxy_pass http://127.0.0.1:3011;
        proxy_set_header Host 127.0.0.1:3011;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
        client_max_body_size 128k;
    }
    location = /health { return 404; }
    location = /ready { return 404; }
    location / {
        proxy_pass http://127.0.0.1:3011;
        proxy_set_header Host 127.0.0.1:3011;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
        client_max_body_size 51m;
    }
}
